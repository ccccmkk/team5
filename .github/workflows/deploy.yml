name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 프리렌더된 HTML은 빌드 시점의 후기만 담는다.
  # 새 후기가 검색에 노출되려면 재빌드가 필요하다 (스펙 §9).
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch: # 발표 직전에 수동으로 한 번 돌린다

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # SUPABASE_SERVICE_ROLE_KEY는 절대 넣지 않는다.
          # 빌드 산출물은 공개되므로 RLS를 우회하는 키가 번들에 섞이면 안 된다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # 측정 ID의 기본값은 lib/brand.ts에 있다 (공개 값이라 숨길 이유가 없고,
          # 저장소 변수는 admin만 만들 수 있어 팀원 대부분이 손댈 수 없다).
          # 다른 속성으로 측정해 보려면 이 변수를 만들면 그쪽이 우선한다.
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # 측정 ID가 없으면 GA 스크립트가 조용히 빠진 채로 배포된다.
      # 조용히 넘어가면 몇 주 뒤 "데이터가 왜 없지"로 돌아오므로 여기서 멈춘다.
      #
      # HTML만 검사한다. "googletagmanager" 문자열은 @next/third-parties 번들에
      # 항상 들어 있어서, JS까지 훑으면 GA가 꺼져 있어도 통과한다.
      - name: GA 연결 확인
        run: |
          if ! grep -rq "gtag/js?id=G-" --include="*.html" out/; then
            echo "::error::GA 스크립트가 배포본 HTML에 없다. 저장소 Settings > Secrets and variables > Actions > Variables 에 GA_MEASUREMENT_ID(G-로 시작)를 등록한다."
            exit 1
          fi
          echo "GA 스크립트 확인됨"
      - name: Jekyll 비활성화
        # Jekyll은 언더스코어로 시작하는 디렉토리를 무시한다. _next가 통째로 사라진다.
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
